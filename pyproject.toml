[project]
name = "videocreation"
version = "0.1.0"
description = "Voice-over con VoiceStudio e montaggio FFmpeg per video social"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["videocreation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
